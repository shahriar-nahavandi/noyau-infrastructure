<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance du Système</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .container { text-align: center; max-width: 600px; padding: 40px; background: #1e293b; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h1 { font-size: 2.2rem; margin-bottom: 15px; font-weight: 600; background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { font-size: 1.1rem; color: #94a3b8; line-height: 1.6; margin-bottom: 30px; }
        .loader { border: 3px solid #334155; border-top: 3px solid #38bdf8; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .footer { margin-top: 35px; font-size: 0.85rem; color: #475569; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mise à jour de l'infrastructure</h1>
        <p>Nos services sont actuellement en cours de maintenance pour des améliorations de performance. Le système sera de nouveau en ligne sous peu. Merci de votre patience.</p>
        <div class="loader"></div>
        <div class="footer">&copy; 2026 Services d'Infrastructure. Tous droits réservés.</div>
    </div>
</body>
</html>
